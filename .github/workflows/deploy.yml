name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual trigger
  workflow_dispatch:

# Grant write access to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download data CSVs from Google Sheets
        run: |
          mkdir -p data
          curl -sL "${{ secrets.GOOGLE_SHEET_MENU_URL }}"    -o data/menu.csv
          curl -sL "${{ secrets.GOOGLE_SHEET_GALLERY_URL }}" -o data/gallery.csv
          curl -sL "${{ secrets.GOOGLE_SHEET_CONFIG_URL }}"  -o data/config.csv
          curl -sL "${{ secrets.GOOGLE_SHEET_SLIDES_URL }}"  -o data/slides.csv
          curl -sL "${{ secrets.GOOGLE_SHEET_TEXT_URL }}"  -o data/text.csv

      - name: Build
        run: npm run build
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: 0
          BOOKING_FORM_ENDPOINT: ${{ secrets.BOOKING_FORM_ENDPOINT }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: "github-pages"
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
